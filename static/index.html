<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Health</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>Crew Health</h1>
    <p id="who-line">Demo crew · prototype</p>
  </div>
  <label class="as">Tablet of
    <select id="as-select" aria-label="Whose tablet this is">
      <option value="lena">Lena (flight engineer)</option>
      <option value="sam">Sam (crew doctor)</option>
      <option value="ravi">Ravi (backup crew medical officer)</option>
      <option value="maya">Maya (commander)</option>
    </select>
  </label>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <div class="spacer"></div>
  <div class="mission">
    <div class="modes" role="group" aria-label="Mission setting">
      <button type="button" data-mode="station">Space station</button>
      <button type="button" data-mode="moon">Moon base</button>
      <button type="button" data-mode="mars">Mars</button>
    </div>
    <div class="delay">Communications to Earth: <b id="delay">…</b></div>
  </div>
  <button type="button" class="btn-get" id="get-doctor">Get crew doctor</button>
  <button type="button" class="btn-demo" id="demo-toggle" aria-expanded="false">Demo controls</button>
</header>

<section class="demo-drawer" id="demo" hidden aria-label="Demo controls">
  <div class="demo-col">
    <b>Scenario S2: staged heart alert</b>
    <button type="button" class="btn" data-act="demo_start_s2">Issue low-confidence heart result for Lena</button>
  </div>
  <div class="demo-col">
    <b>Solar particle event replay</b>
    <div id="spe-events" class="spe-events"></div>
  </div>
  <div class="demo-col">
    <b>Demo</b>
    <button type="button" class="btn secondary" data-act="reset">Reset everything</button>
    <small>Open this page in several windows with a different tablet selected to see the views stay in sync.</small>
  </div>
</section>

<main id="main" aria-live="polite"></main>

<div id="cite-pop" class="cite-pop" role="dialog" aria-label="Source" hidden></div>
<div id="modal" class="modal" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
